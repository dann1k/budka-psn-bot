name: Deploy Supabase

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      BUDKA_PSN_TELEGRAM_BOT_TOKEN: ${{ secrets.BUDKA_PSN_TELEGRAM_BOT_TOKEN }}
      BUDKA_PSN_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.BUDKA_PSN_TELEGRAM_WEBHOOK_SECRET }}
      BUDKA_PSN_NPSSO: ${{ secrets.BUDKA_PSN_NPSSO }}
      BUDKA_PSN_SUPABASE_SECRET_KEY: ${{ secrets.BUDKA_PSN_SUPABASE_SECRET_KEY }}
      BUDKA_PSN_AUTH_ENCRYPTION_KEY: ${{ secrets.BUDKA_PSN_AUTH_ENCRYPTION_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate required secrets
        run: |
          missing=0
          for name in \
            SUPABASE_ACCESS_TOKEN \
            SUPABASE_PROJECT_REF \
            BUDKA_PSN_TELEGRAM_BOT_TOKEN \
            BUDKA_PSN_TELEGRAM_WEBHOOK_SECRET \
            BUDKA_PSN_NPSSO \
            BUDKA_PSN_SUPABASE_SECRET_KEY \
            BUDKA_PSN_AUTH_ENCRYPTION_KEY
          do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is not set"
              missing=1
            fi
          done
          exit "$missing"

      - name: Check Edge Function
        run: deno check supabase/functions/telegram-webhook/index.ts

      - name: Set Supabase Edge Function secrets
        run: |
          supabase secrets set \
            BUDKA_PSN_TELEGRAM_BOT_TOKEN="$BUDKA_PSN_TELEGRAM_BOT_TOKEN" \
            BUDKA_PSN_TELEGRAM_WEBHOOK_SECRET="$BUDKA_PSN_TELEGRAM_WEBHOOK_SECRET" \
            BUDKA_PSN_NPSSO="$BUDKA_PSN_NPSSO" \
            BUDKA_PSN_SUPABASE_SECRET_KEY="$BUDKA_PSN_SUPABASE_SECRET_KEY" \
            BUDKA_PSN_AUTH_ENCRYPTION_KEY="$BUDKA_PSN_AUTH_ENCRYPTION_KEY" \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function
        run: supabase functions deploy telegram-webhook --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api

      - name: Configure Telegram webhook
        run: |
          WEBHOOK_URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/telegram-webhook"
          TG_API="https://api.telegram.org/bot${BUDKA_PSN_TELEGRAM_BOT_TOKEN}"

          # Force Telegram to drop any cached secret_token by deleting the
          # webhook first. setWebhook with the same URL is a no-op for
          # secret_token rotation, which has caused 401 drift in the past.
          curl --fail --silent --show-error \
            --request POST "${TG_API}/deleteWebhook" \
            --header "Content-Type: application/json" \
            --data '{"drop_pending_updates": false}'
          echo

          PAYLOAD="$(jq -nc \
            --arg url "$WEBHOOK_URL" \
            --arg secret "$BUDKA_PSN_TELEGRAM_WEBHOOK_SECRET" \
            '{url: $url, secret_token: $secret, allowed_updates: ["message", "callback_query"], drop_pending_updates: false}')"

          curl --fail --silent --show-error \
            --request POST "${TG_API}/setWebhook" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD"
          echo

      - name: Verify Telegram webhook
        run: |
          TG_API="https://api.telegram.org/bot${BUDKA_PSN_TELEGRAM_BOT_TOKEN}"
          EXPECTED_URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/telegram-webhook"
          DEPLOY_STARTED_AT="$(date -u +%s)"

          # Give Telegram a few seconds to attempt a delivery so that any
          # secret_token mismatch surfaces as last_error_date in getWebhookInfo.
          sleep 10

          INFO="$(curl --fail --silent --show-error "${TG_API}/getWebhookInfo")"
          echo "$INFO" | jq .

          ACTUAL_URL="$(echo "$INFO" | jq -r '.result.url')"
          LAST_ERR_DATE="$(echo "$INFO" | jq -r '.result.last_error_date // 0')"
          LAST_ERR_MSG="$(echo "$INFO" | jq -r '.result.last_error_message // ""')"

          if [ "$ACTUAL_URL" != "$EXPECTED_URL" ]; then
            echo "::error::webhook url mismatch: expected=$EXPECTED_URL actual=$ACTUAL_URL"
            exit 1
          fi

          if [ "$LAST_ERR_DATE" -ge "$DEPLOY_STARTED_AT" ]; then
            echo "::error::telegram reported a webhook delivery error after deploy: $LAST_ERR_MSG"
            exit 1
          fi
